version: 2

# Updates target develop, not the default branch. main only moves by a release
# pull request, so a bump opened against it would either sit unmergeable or
# land out of sequence with the branch it was tested on.
updates:
  - package-ecosystem: bundler
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Rails ships its components in lockstep and its advisories name several of
    # them at once, so one pull request per component would be one change split
    # six ways.
    groups:
      rails:
        patterns:
          - rails
          - railties
          - action*
          - active*
    ignore:
      - dependency-name: rails
        update-types: [version-update:semver-major]
      - dependency-name: railties
        update-types: [version-update:semver-major]
      - dependency-name: action*
        update-types: [version-update:semver-major]
      - dependency-name: active*
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@rails/*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly

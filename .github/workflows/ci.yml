name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: RSpec
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: stafflow
          MYSQL_DATABASE: stafflow_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pstafflow"
          --health-interval=5s --health-timeout=5s --health-retries=20

      elasticsearch:
        image: elasticsearch:7.17.9
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=20

    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: stafflow
      TEST_DATABASE_NAME: stafflow_test
      ELASTICSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v4

      # The variant specs need libvips, which the 7.0 defaults select over
      # ImageMagick. The Dockerfile installs it as libvips42, the Debian name;
      # noble's 64-bit time_t transition renamed the same library, so the two
      # spellings here and there are the same package and neither is a typo.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev libvips42t64

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true

      # Request specs render real views, and Sprockets serves whatever esbuild
      # wrote into app/assets/builds. Nothing compiles that on demand, so the
      # bundle has to be built here or every request spec fails on a missing
      # asset rather than on its own assertion.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build the JavaScript bundle
        run: yarn build

      - name: Prepare the database
        run: bundle exec rails db:test:prepare

      - name: Run the suite
        run: bundle exec rspec --format progress

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - run: bundle exec rubocop --format github

  security:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      # The count is zero, so a warning now fails the build. Zero is narrower
      # than it looks: Brakeman 5.4.1's EOL tables end before the versions this
      # app runs. Its Rails table stops at 6.0 and its Ruby table stops at 3.0,
      # so neither Ruby 3.2 nor Rails 7.0 can be reported however old they get.
      # ROADMAP.md tracks the real state.
      - run: bundle exec brakeman --no-pager --format plain

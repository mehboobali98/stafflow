# .rubocop_todo.yml records the offenses that already existed when this config
# was introduced, so CI enforces the standard on new code without requiring a
# single sweeping reformat. Entries should be removed as the code is cleaned.
inherit_from: .rubocop_todo.yml

require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'config/environments/**/*'

# The codebase was written before this config existed and already follows
# most of these. Cops below are relaxed where the existing style is
# deliberate rather than accidental.

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 200

Layout/LineLength:
  Max: 120

# A TargetRubyVersion of 3.1 or later makes this cop ask for Ruby 3.1's hash
# value omission - `company: company` becomes `company:` - in 225 places. That
# is a restyle of the whole codebase, not part of running on a newer Ruby, and
# it would bury the upgrade it rode in on. Both forms are valid, so both are
# allowed and new code may use either.
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/routes.rb'
    - 'db/seeds.rb'

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 6

RSpec/NestedGroups:
  Max: 4

# The ability matrix and tenant isolation specs describe behaviour that has no
# single subject, so instance variables and let names read better than subject.
RSpec/InstanceVariable:
  Enabled: false

# Request specs describe a route rather than a class, and the explicit
# `type: :request` is what keeps RSpec/DescribeClass quiet about that. Removing
# it as redundant, which this cop asks for, makes the other one fire instead.
RSpecRails/InferredSpecType:
  Exclude:
    - 'spec/requests/**/*'

# The bundling guard describes the JavaScript build rather than a Ruby class,
# so there is no constant to hand RSpec/DescribeClass. Unlike the request specs
# above there is no spec type that would satisfy it either.
RSpec/DescribeClass:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/javascript/**/*'

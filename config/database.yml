# MySQL. Connection details come from the environment so the same config works
# for a local install and for docker-compose. See .env.example.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 3306 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "stafflow_development" } %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME") { "stafflow_test" } %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "stafflow_production" } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { "stafflow" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "" } %>

  landing_page:
    header_name: "Stafflow"
    nav_items:
      home: "Home"
      team: "Contributors"
      services: "Features"
      about: "About"
    header_message_one: "One system of record for your people"
    header_message_two: "Employees, org structure, leave, benefits and payroll — every company on its own subdomain."
    team:
      heading: "Contributors"
      paragraph: "Stafflow was built by four engineers. The areas below reflect what each person primarily worked on."
      member_one_name: "Nadia Ahsan"
      member_two_name: "Abdul Basit"
      member_three_name: "Shehryar Khan"
      member_four_name: "Mehboob Ali"
      member_one_designation: "Org structure"
      member_two_designation: "Authentication & employees"
      member_three_designation: "Payroll & benefits"
      member_four_designation: "Leave & scheduling"
      member_one_details: "Departments and designations, and the validation rules that keep a designation tied to its parent department."
      member_two_details: "Devise sign-in, confirmation and password reset flows, plus employee records and profile management."
      member_three_details: "Benefit definitions, per-employee benefit assignment, and monthly payroll generation with tax and benefit lines."
      member_four_details: "Leave types and balances, the apply/approve/reject workflow, bulk approvals, and the shared events calendar."
    services:
      header_message: "Features"
      first_header: "Multi-tenant by design"
      second_header: "Role-based access"
      third_header: "Leave workflows"
      fourth_header: "Payroll & benefits"
      first_detail: "Every company signs in on its own subdomain. Tenant scoping is applied automatically at the model layer, so records never cross between companies."
      second_detail: "Four roles — account owner, HR, department head and employee — with permissions declared per resource and checked on every action."
      third_detail: "Employees apply against their remaining balance; HR and department heads approve or reject one at a time or in bulk. Balances reset on a nightly schedule."
      fourth_detail: "Generate monthly payroll per employee with a configurable tax rate and itemised benefit lines, and notify the department head automatically."
    about:
      header_message: "About"
      first_paragraph: "Stafflow is a multi-tenant HR management system built with Ruby on Rails. A single deployment serves many companies, each isolated on its own subdomain with its own employees, org structure, policies and payroll history."
      second_paragraph: "It covers the core HR surface end to end rather than a single module: employee records, departments and designations, leave, benefits, payroll, events and notifications."
      first_list: "Tenant isolation enforced at the model layer, not left to individual queries."
      second_list: "Permissions declared per resource across four roles and checked on every action."
      third_list: "Full-text employee search, dashboard analytics, and email notifications delivered in the background."
    button:
      learn_more: "Learn More"
    footer:
      text_one: "Copyright "
      text_two: "Stafflow"
      text_three: ". All Rights Reserved"
